# cert-manager installation is performed via Helm, not raw manifests.
# This file documents the command for reference; install.sh executes it.
#
# CHART:    jetstack/cert-manager
# VERSION:  v1.16.2 (matches K3s 1.30/1.31 CRDs as of 2026-05)
# CRDs:     installed via --set crds.enabled=true (no separate CRD apply step)
#
# Install:
#   helm repo add jetstack https://charts.jetstack.io
#   helm repo update
#   helm install cert-manager jetstack/cert-manager \
#     --namespace cert-manager \
#     --version v1.16.2 \
#     --set crds.enabled=true \
#     --set global.leaderElection.namespace=cert-manager \
#     --wait
#
# Verify:
#   kubectl -n cert-manager get pods
#   kubectl get crd | grep cert-manager
#
# Upgrade path: bump --version, rerun helm upgrade. CRD updates handled
# via crds.enabled=true (no manual reapply).
