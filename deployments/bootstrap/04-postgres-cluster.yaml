apiVersion: v1
kind: Secret
metadata:
  name: zapfast-pg-app
  namespace: zapfast
type: kubernetes.io/basic-auth
stringData:
  # IMPORTANT: replace with a strong password BEFORE applying.
  # Generate: openssl rand -base64 32
  # In CI/CD this Secret should come from External Secrets Operator.
  username: zapfast
  password: CHANGE_ME_BEFORE_APPLY
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zapfast-pg
  namespace: zapfast
spec:
  # V1: single primary instance (no HA). F2 raises this to 3 with sync replication.
  # Scaling to 3 instances triggers automatic streaming replication + leader election.
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-bookworm

  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: zapfast
      owner: zapfast
      secret:
        name: zapfast-pg-app
      # Locale matters for full-text search on PT-BR content.
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
      encoding: UTF8

  storage:
    # V1: 20Gi using Hetzner CSI default StorageClass.
    # Watch disk usage via Grafana — bump when > 70% full.
    # CNPG supports online expansion via spec.storage.size bump.
    size: 20Gi
    storageClass: hcloud-volumes

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "8MB"
      maintenance_work_mem: "64MB"
      # Cancel runaway queries after 5s — wuzapi should never need longer
      statement_timeout: "5000"
      idle_in_transaction_session_timeout: "60000"
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_connections: "off"
      log_disconnections: "off"
      log_lock_waits: "on"
      log_temp_files: "0"
      timezone: "America/Sao_Paulo"

  monitoring:
    enablePodMonitor: true

  # Backup goes to S3-compatible storage. Configure barmanObjectStore when
  # bucket is ready; commented out for V1 (no offsite backup yet).
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://zapfast-backups/pg
  #     s3Credentials:
  #       accessKeyId:
  #         name: zapfast-pg-backup-creds
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: zapfast-pg-backup-creds
  #         key: SECRET_ACCESS_KEY
  #   retentionPolicy: "30d"
