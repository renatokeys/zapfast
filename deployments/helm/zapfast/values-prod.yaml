# Production overrides for zapfast.
# Apply with: helm upgrade --install zapfast ./helm/zapfast \
#   -f helm/zapfast/values.yaml -f helm/zapfast/values-prod.yaml \
#   --namespace zapfast

replicaCount: 3

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  host: zapfast.hivenzz.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

# In prod, anti-affinity is REQUIRED (not preferred) — never schedule two
# zapfast pods on the same node.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - zapfast
        topologyKey: kubernetes.io/hostname

# Longer grace period in prod (still V1 — F2 raises this to 1200).
terminationGracePeriodSeconds: 120

lifecycle:
  preStopSleepSeconds: 20
