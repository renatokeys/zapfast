{{- if not .Values.db.existingSecret -}}
{{/*
This template renders a Secret only when the user did NOT provide
an existingSecret. For real deployments, prefer:

  kubectl -n zapfast create secret generic zapfast-secret \
    --from-literal=DB_USER='zapfast' \
    --from-literal=DB_PASSWORD='<from CNPG bootstrap>' \
    --from-literal=WUZAPI_ADMIN_TOKEN='<openssl rand -hex 32>'

...and set db.existingSecret=zapfast-secret in values.

External Secrets Operator integration: replace this with an
ExternalSecret pointing at Vault / AWS SM / Doppler when ready.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zapfast.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zapfast.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.db.user | quote }}
  DB_PASSWORD: {{ .Values.db.password | quote }}
  WUZAPI_ADMIN_TOKEN: {{ .Values.adminToken | quote }}
{{- end }}
