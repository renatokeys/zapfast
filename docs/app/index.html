<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zapfast — Painel</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { zfprimary: '#0f172a', zfaccent: { 400: '#34d399', 500: '#10b981', 600: '#059669' } } } } };
  </script>
  <link rel="stylesheet" href="../assets/styles.css" />
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="font-sans bg-slate-50">

<div x-data="dashboard()" x-init="init()" class="min-h-screen flex">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-zfprimary text-slate-200 flex flex-col fixed h-screen">
    <div class="p-6 border-b border-slate-800">
      <img src="../assets/logo-white.svg" alt="zapfast" class="h-8" />
    </div>
    <nav class="flex-1 p-3 space-y-1 text-sm">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Instâncias
      </a>
      <a href="send.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/60">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        Enviar mensagem
      </a>
      <a href="docs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/60">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Documentação
      </a>
      <a href="https://github.com/renatokeys/zapfast" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/60">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2c-3.2.7-3.87-1.36-3.87-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.69 1.24 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.19 1.18a11.06 11.06 0 0 1 5.81 0c2.22-1.5 3.19-1.18 3.19-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.66.79.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>
        GitHub
      </a>
    </nav>
    <div class="p-3 border-t border-slate-800">
      <div class="px-3 py-2 text-xs text-slate-500 truncate" :title="endpoint" x-text="endpoint"></div>
      <button @click="logout()" class="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800/60 text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 ml-64 p-8">

    <header class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-extrabold text-zfprimary">Instâncias</h1>
        <p class="text-sm text-slate-600 mt-1">Gerencie todos os números conectados ao seu zapfast.</p>
      </div>
      <button @click="openCreate = true" class="zf-btn-primary !py-2.5 !px-4">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Nova instância
      </button>
    </header>

    <!-- STATS -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="zf-card !p-5">
        <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Total</p>
        <p class="text-3xl font-extrabold text-zfprimary mt-1" x-text="instances.length"></p>
      </div>
      <div class="zf-card !p-5">
        <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Backend</p>
        <p class="text-sm font-bold mt-2 inline-flex items-center gap-2">
          <span class="dot-live" :class="health ? '' : 'opacity-30'"></span>
          <span :class="health ? 'text-emerald-600' : 'text-red-500'" x-text="health ? 'online' : 'offline'"></span>
        </p>
      </div>
      <div class="zf-card !p-5">
        <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Versão</p>
        <p class="text-sm font-bold text-zfprimary mt-2" x-text="version || '—'"></p>
      </div>
      <div class="zf-card !p-5">
        <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Uptime</p>
        <p class="text-sm font-bold text-zfprimary mt-2" x-text="uptime || '—'"></p>
      </div>
    </div>

    <!-- INSTANCES TABLE -->
    <div class="zf-card !p-0 overflow-hidden">
      <div class="p-5 border-b border-slate-200 flex items-center justify-between">
        <h2 class="font-bold text-zfprimary">Suas instâncias</h2>
        <button @click="loadInstances()" class="text-sm text-slate-500 hover:text-emerald-600 inline-flex items-center gap-1">
          <svg class="w-4 h-4" :class="loading && 'animate-spin'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Atualizar
        </button>
      </div>

      <template x-if="loading && instances.length === 0">
        <div class="p-12 text-center text-slate-500">Carregando...</div>
      </template>

      <template x-if="!loading && instances.length === 0">
        <div class="p-12 text-center">
          <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
          </div>
          <h3 class="font-bold text-zfprimary mb-1">Nenhuma instância ainda</h3>
          <p class="text-sm text-slate-600 mb-4">Crie a primeira pra começar a enviar mensagens.</p>
          <button @click="openCreate = true" class="zf-btn-primary !py-2 !px-4 inline-flex">Criar instância</button>
        </div>
      </template>

      <template x-if="instances.length > 0">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
            <tr>
              <th class="text-left p-4 font-semibold">Nome</th>
              <th class="text-left p-4 font-semibold">ID</th>
              <th class="text-left p-4 font-semibold">Token</th>
              <th class="text-left p-4 font-semibold">Webhook</th>
              <th class="text-right p-4 font-semibold">Ações</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200">
            <template x-for="i in instances" :key="i.id">
              <tr class="hover:bg-slate-50 transition">
                <td class="p-4">
                  <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white font-bold text-sm" x-text="(i.name || '?').charAt(0).toUpperCase()"></div>
                    <div>
                      <div class="font-semibold text-zfprimary" x-text="i.name || '(sem nome)'"></div>
                      <div class="text-xs text-slate-500">criada agora</div>
                    </div>
                  </div>
                </td>
                <td class="p-4 font-mono text-xs text-slate-500" x-text="(i.id || '').slice(0, 12) + '…'"></td>
                <td class="p-4 font-mono text-xs">
                  <span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-slate-100 text-slate-700" x-text="i.token ? (i.token.slice(0,8) + '…') : '—'"></span>
                </td>
                <td class="p-4 text-xs text-slate-600 max-w-[200px] truncate" :title="i.webhook" x-text="i.webhook || '—'"></td>
                <td class="p-4 text-right">
                  <a :href="'instance.html?id=' + i.id" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold text-xs">
                    Conectar
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                  </a>
                  <button @click="deleteInstance(i.id)" class="ml-1 p-1.5 rounded-lg hover:bg-red-50 text-slate-400 hover:text-red-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"/></svg>
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
    </div>

    <p class="text-xs text-slate-500 mt-6 text-center">
      <a href="../index.html" class="hover:text-emerald-600">← voltar para landing</a>
    </p>

  </main>

  <!-- CREATE MODAL -->
  <div x-show="openCreate" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm" @click.self="openCreate = false">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-7" @click.stop>
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-xl font-extrabold text-zfprimary">Nova instância</h3>
        <button @click="openCreate = false" class="text-slate-400 hover:text-slate-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form @submit.prevent="createInstance()" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-zfprimary mb-2">Nome</label>
          <input x-model="newName" required type="text" placeholder="ex: vendas-sp"
            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-zfprimary mb-2">Webhook URL (opcional)</label>
          <input x-model="newWebhook" type="url" placeholder="https://seu-app.com/webhook"
            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm" />
        </div>
        <div x-show="createErr" x-text="createErr" class="p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"></div>
        <div class="flex gap-3 pt-2">
          <button type="button" @click="openCreate = false" class="flex-1 px-4 py-3 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 font-semibold text-sm">Cancelar</button>
          <button type="submit" :disabled="creating" class="flex-1 zf-btn-primary justify-center !py-3" x-text="creating ? 'Criando...' : 'Criar instância'"></button>
        </div>
      </form>
    </div>
  </div>

</div>

<script>
  function dashboard() {
    return {
      endpoint: localStorage.getItem('zf_endpoint') || '',
      token: localStorage.getItem('zf_token') || '',
      instances: [],
      loading: false,
      health: false,
      version: null,
      uptime: null,
      openCreate: false,
      newName: '',
      newWebhook: '',
      createErr: '',
      creating: false,

      async init() {
        if (!this.token || !this.endpoint) {
          window.location.href = '../login.html';
          return;
        }
        await this.checkHealth();
        await this.loadInstances();
      },

      async checkHealth() {
        try {
          const r = await fetch(`${this.endpoint}/health`);
          if (r.ok) {
            const d = await r.json();
            this.health = d.status === 'ok';
            this.version = d.version;
            this.uptime = d.uptime;
          }
        } catch (e) { this.health = false; }
      },

      async loadInstances() {
        this.loading = true;
        try {
          const r = await fetch(`${this.endpoint}/admin/users`, { headers: { Authorization: this.token } });
          if (r.status === 401 || r.status === 403) return this.logout();
          const d = await r.json();
          this.instances = (d.data || d || []).filter(i => i.id);
        } catch (e) { console.error(e); }
        finally { this.loading = false; }
      },

      async createInstance() {
        this.createErr = '';
        this.creating = true;
        try {
          const r = await fetch(`${this.endpoint}/admin/users`, {
            method: 'POST',
            headers: { Authorization: this.token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: this.newName, webhook: this.newWebhook || undefined }),
          });
          const d = await r.json();
          if (!r.ok || d.success === false) throw new Error(d.error || `erro ${r.status}`);
          this.newName = ''; this.newWebhook = '';
          this.openCreate = false;
          await this.loadInstances();
        } catch (e) { this.createErr = 'Falha: ' + e.message; }
        finally { this.creating = false; }
      },

      async deleteInstance(id) {
        if (!confirm('Excluir essa instância?')) return;
        try {
          const r = await fetch(`${this.endpoint}/admin/users/${id}`, {
            method: 'DELETE',
            headers: { Authorization: this.token },
          });
          if (!r.ok) throw new Error(`erro ${r.status}`);
          await this.loadInstances();
        } catch (e) { alert('Falha: ' + e.message); }
      },

      logout() {
        localStorage.removeItem('zf_token');
        window.location.href = '../login.html';
      },
    };
  }
</script>

</body>
</html>
